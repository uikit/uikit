name: "Feature Request 🌟"
title: "[🌟feature] :  "
description: "Suggest an idea for a new feature."
projects: []
labels:
  - '! Feature'
body:
  - type: markdown
    attributes:
      value: |
        👋 Hi, thank you for using UIKit!

        Please open an issues only for a bug report or feature request. Make sure no one else has already opened a similar issue. If you need help or have questions about UIkit, there are few places to start:
        
        - Search our public documentation: https://getuikit.com/docs
        - Ask the community in the Discord chat: https://discord.gg/NEt4Pv7
        - Look for an answer on Stack Overflow: https://stackoverflow.com/questions/ask?tags=getuikit

  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What feature are you requesting? What problem does it solve?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: On a scale of 1-5, how important is this feature to you?
      multiple: false
      options:
        - 0
        - 1
        - 2
        - 3
        - 4
        - 5
      default: 5
    validations:
      required: true
  
  - type: textarea
    id: explain-priorty
    attributes:
      label: Please explain The Priority
      description: Please explain the Priority. How important is this feature to you.
